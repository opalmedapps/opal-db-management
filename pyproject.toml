[project]
name = "db-management"
version = "0"
description = "DB Management for Opal's legacy databases"
readme = "README.md"
requires-python = "==3.14.4"
dependencies = [
    "alembic==1.18.4",
    "mysqlclient==2.2.8",
    "pymysql==1.1.2",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.49",
]

[dependency-groups]
dev = [
    "alembic==1.18.4",
    "mypy==1.20.2",
    "mysqlclient==2.2.8",
    "prek==0.3.9",
    "pymysql==1.1.2",
    "pytest==9.0.3",
    "pytest-alembic==0.12.1",
    "python-dotenv==1.2.2",
    "ruff==0.15.10",
    "sqlalchemy==2.0.49",
    "types-pymysql==1.1.0.20260408",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
